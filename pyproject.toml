[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quick_mag"
version = "0.1.0"
description = "Perovskite/crystal structure builder, visualization, and collinear-magnetism tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# Dependencies needed only to run the interactive imgui builder/visualization UI.
ui = ["imgui-bundle"]
# Development, testing, and documentation.
dev = [
    "pytest",
    "mkdocs-material",
    "pymdown-extensions",
]

[project.urls]
Homepage = "https://github.com/heindelj/quick-mag"
Documentation = "https://heindelj.github.io/quick-mag/"

# Register the unified command-line tool: `quick-mag solve ...` and `quick-mag ui`.
[project.scripts]
quick-mag = "quick_mag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quick_mag*"]

# Ship the fitted exchange-polarization parameter sets alongside the package so the
# __file__-relative loader in polarization_model.py finds them after installation.
[tool.setuptools.package-data]
"quick_mag" = ["exchange_params/*.json"]
